<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EM — Connect and share with your community</title>
    <meta
      name="description"
      content="EM is a social app for sharing updates, following people you care about, and keeping up with your community in real time."
    />
    <meta name="theme-color" content="#1565D8" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://em-mern-social-app.vercel.app/" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EM" />
    <meta property="og:title" content="EM — Connect and share with your community" />
    <meta
      property="og:description"
      content="Share updates, follow people you care about, and keep up with your community in real time."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:url" content="https://em-mern-social-app.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EM — Connect and share with your community" />
    <meta
      name="twitter:description"
      content="Share updates, follow people you care about, and keep up with your community in real time."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Connect early to the origins we know we'll need -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://em-mern-social-app.onrender.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
